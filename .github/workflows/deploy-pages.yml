name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Finish deployment and save its history before the next release starts.
  cancel-in-progress: false

jobs:
  deploy:
    # main/master can both exist, but one production site must have one history.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_PAGES: 'true'
      # Reruns retain earlier artifacts; deploy only this attempt's uniquely named upload.
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      # 使用统计。值存在仓库的 Variables 里，不写死在这份 YAML——
      # fork 出去的仓库继承得到工作流、继承不到 Variables，构建出来就是零统计的版本
      # （两个变量缺任何一个，统计脚本压根不会加载）。详见 docs/analytics.md。
      VITE_UMAMI_SCRIPT_URL: ${{ vars.UMAMI_SCRIPT_URL }}
      VITE_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          # Node 20 在 runner 上默认堆约 2GB，vite 打包大 chunk 时会
          # "Ineffective mark-compacts near heap limit" 直接 134 退出（本地大内存不复现）。
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Verify build asset retention
        run: node --test scripts/prepare-retained-build-assets.test.mjs

      # GitHub Pages 不做历史 chunk 保留：保留机制会把每次构建的旧文件累积进 dist
      # （实测可达 250MB+ 超过 Pages artifact 上限，导致上传"成功"但 deploy 时
      # Found 0 artifact(s)）。Pages 每次部署是原子切换，旧标签页由 startup-recovery
      # 的「检查更新并修复」自我修复；历史 chunk 保留只留给 Cloudflare 站点。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
